<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>acobot</title>
    <script>
      // Match ThemeProvider's default (dark unless 'light' is stored) before first paint,
      // so the page never shows white behind the app.
      document.documentElement.className =
        localStorage.getItem('acobot-theme') === 'light' ? 't-light' : 't-dark dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
